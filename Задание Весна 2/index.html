<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="mindar-image.prod.js"></script>
    <script src="aframe.min.js"></script>
    <script src="mindar-image-aframe.prod.js"></script>
  </head>
  <body>
    <a-scene mindar-image="imageTargetSrc: targets(1).mind;" color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
      <a-assets>
        <!--<a-asset-item id="logo" src="stankin_logo.glb"></a-asset-item>-->
        <a-asset-item id="mt" src="machinetool.glb"></a-asset-item>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity mindar-image-target="targetIndex: 0">
        <a-gltf-model rotation="90 0 0 " position="0 0 0.1" scale="0.3 0.3 0.3" src="#mt">
      </a-entity>
    </a-scene>
  </body>
</html>
